name: 詢問是否收錄新網頁

on:
  schedule:
    - cron: "20 1 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: 先詢問，再收錄
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const portfolioRepo = context.repo.repo;
            const excluded = new Set(["money", portfolioRepo]);

            const source = await github.rest.repos.getContent({
              owner,
              repo: portfolioRepo,
              path: "app.js"
            });
            const text = Buffer.from(source.data.content, "base64").toString("utf8");
            const included = new Set(
              [...text.matchAll(/repo:\s*["']([^"']+)["']/g)].map(match => match[1].toLowerCase())
            );

            const repositories = await github.paginate(github.rest.repos.listForUser, {
              username: owner,
              type: "owner",
              per_page: 100
            });

            const candidates = repositories.filter(repo =>
              !repo.private &&
              !repo.archived &&
              repo.has_pages &&
              !excluded.has(repo.name) &&
              !included.has(repo.name.toLowerCase())
            );

            if (!candidates.length) {
              core.info("目前沒有尚未詢問的新網頁。");
              return;
            }

            try {
              await github.rest.issues.getLabel({ owner, repo: portfolioRepo, name: "作品收錄確認" });
            } catch {
              await github.rest.issues.createLabel({
                owner,
                repo: portfolioRepo,
                name: "作品收錄確認",
                color: "b7ff57",
                description: "新網頁是否加入展示站，等待本人決定"
              });
            }

            const allIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo: portfolioRepo,
              state: "all",
              labels: "作品收錄確認",
              per_page: 100
            });

            for (const repo of candidates) {
              const marker = `<!-- portfolio-candidate:${repo.name.toLowerCase()} -->`;
              if (allIssues.some(issue => issue.body?.includes(marker))) continue;

              await github.rest.issues.create({
                owner,
                repo: portfolioRepo,
                title: `是否將「${repo.name}」加入教學作品庫？`,
                labels: ["作品收錄確認"],
                body: `${marker}\n## 發現新的公開網頁\n\n- 專案：[${repo.full_name}](${repo.html_url})\n- 網頁：[開啟 GitHub Pages](${repo.html_url.replace("github.com", `${owner.toLowerCase()}.github.io`).replace(`/${owner}/`, "/")}/)\n- 說明：${repo.description || "尚未填寫"}\n\n請由本人決定：\n\n- [ ] 要收錄（請留言建議分類，或交由系統整理）\n- [ ] 暫不收錄\n\n確認後再更新展示網站；此流程不會自行把新作品公開到作品庫。`
              });
            }
