name: 提議收錄外部網頁
description: 詢問是否把非 GitHub Pages 網頁加入展示站
title: "是否收錄外部網頁："
labels:
  - 作品收錄確認
body:
  - type: markdown
    attributes:
      value: 這張表只提出收錄建議；提交後仍需本人確認，網站不會自動加入。
  - type: input
    id: url
    attributes:
      label: 網頁網址
      placeholder: https://example.com/
    validations:
      required: true
  - type: input
    id: title
    attributes:
      label: 作品名稱
    validations:
      required: true
  - type: textarea
    id: use
    attributes:
      label: 教學用途
      description: 這個網頁適合什麼課程或教學情境？
  - type: dropdown
    id: decision
    attributes:
      label: 是否收錄
      options:
        - 請先讓本人確認
        - 要收錄
        - 暫不收錄
    validations:
      required: true
